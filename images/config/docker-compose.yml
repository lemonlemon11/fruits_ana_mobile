name: fruits-ana-mobile-offline

services:
  mobile-web:
    image: fruits-ana-mobile-web:local
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:54001/
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
